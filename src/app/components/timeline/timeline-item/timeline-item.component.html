<div class="timeline-item">
	<div class="timeline-item__logo-wrapper">
		<img
			class="timeline-item__logo"
			[ngSrc]="item.logoUrl"
			[alt]="item.logoAlt"
			width="46"
			height="46"
			loading="lazy"
		/>
	</div>
	<div class="timeline-item__content">
		<h3 class="timeline-item__institution-name">{{ item.title }}</h3>
		<p class="timeline-item__program-title">{{ item.subtitle }}</p>
		<p class="timeline-item__time-period">
			{{ item.meta
			}}<ng-container *ngIf="item.location"> · {{ item.location }}</ng-container>
		</p>

		<p class="timeline-item__detail" *ngFor="let detail of item.details">
			{{ detail }}
		</p>

		<div class="timeline-item__highlights" *ngIf="item.highlights?.length">
			<h4 class="timeline-item__highlights-title">
				{{ item.highlightsTitle ?? 'Destaques' }}
			</h4>
			<ul class="timeline-item__highlights-list">
				<li *ngFor="let highlight of item.highlights">{{ highlight }}</li>
			</ul>
		</div>

		<ul class="timeline-item__skills" *ngIf="item.skills?.length">
			<li class="timeline-item__skill" *ngFor="let skill of item.skills">
				{{ skill }}
			</li>
		</ul>

		<a
			*ngIf="item.link"
			class="timeline-item__link"
			[href]="item.link.url"
			target="_blank"
			rel="noopener noreferrer"
			>{{ item.link.label }}
			<svg class="timeline-item__link-icon" aria-hidden="true">
				<use
					xlink:href="assets/icons/arrow-up-right-icon.svg#arrow-up-right-icon"
				></use>
			</svg>
		</a>
	</div>
</div>

<div class="theme-toggle" role="radiogroup" aria-label="Tema">
	<button
		*ngFor="let option of options"
		class="theme-toggle__option"
		type="button"
		role="radio"
		[class.theme-toggle__option--active]="mode === option.mode"
		[attr.aria-checked]="mode === option.mode"
		[attr.aria-label]="option.label"
		[title]="option.label"
		(click)="setMode(option.mode)"
	>
		<ng-container [ngSwitch]="option.mode">
			<svg *ngSwitchCase="'system'" class="theme-toggle__icon" viewBox="0 0 24 24" aria-hidden="true">
				<rect x="3" y="4" width="18" height="12" rx="1.5" />
				<path d="M8 20h8M12 16v4" />
			</svg>
			<svg *ngSwitchCase="'light'" class="theme-toggle__icon" viewBox="0 0 24 24" aria-hidden="true">
				<circle cx="12" cy="12" r="4" />
				<path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
			</svg>
			<svg *ngSwitchCase="'dark'" class="theme-toggle__icon" viewBox="0 0 24 24" aria-hidden="true">
				<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" />
			</svg>
		</ng-container>
	</button>
</div>
